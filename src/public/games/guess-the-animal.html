<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Guess the Animal</title>
<style>
  :root { --bg:#1f6f43; --card:#fffdf5; --ink:#222; --accent:#f4b400; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; background:radial-gradient(circle at top,#2e9b5e,var(--bg)); font-family:"Trebuchet MS",system-ui,sans-serif; color:var(--ink); display:flex; flex-direction:column; align-items:center; padding:16px; user-select:none; }
  h1 { color:#fff; text-shadow:2px 2px 0 #0004; margin:8px 0 16px; text-align:center; }
  .cats { display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:12px; width:100%; max-width:760px; }
  .cat { background:var(--card); border:4px solid var(--accent); border-radius:16px; padding:16px 8px; font-size:1.1rem; font-weight:bold; cursor:pointer; text-align:center; box-shadow:0 4px 0 #0003; }
  .cat span { display:block; font-size:2.6rem; }
  .cat:hover { transform:translateY(-3px); }
  #game { display:none; flex-direction:column; align-items:center; width:100%; }
  .bar { display:flex; justify-content:space-between; align-items:center; width:100%; max-width:420px; color:#fff; margin-bottom:10px; font-weight:bold; }
  .bar button { background:var(--accent); border:none; border-radius:10px; padding:8px 14px; font-weight:bold; cursor:pointer; }
  .card { width:min(92vw,380px); aspect-ratio:2/3; background:var(--card); border:10px solid var(--accent); border-radius:24px; box-shadow:0 10px 0 #0004; display:flex; flex-direction:column; align-items:center; justify-content:center; cursor:pointer; position:relative; }
  .card .tag { position:absolute; top:12px; left:0; right:0; text-align:center; font-size:.9rem; letter-spacing:2px; text-transform:uppercase; color:#777; }
  .pic { width:88%; height:68%; object-fit:cover; border-radius:14px; background:#eee; margin-top:20px; }
  .cat small { display:block; font-weight:normal; color:#777; font-size:.8rem; margin-top:4px; }
  .credit { color:#fff; opacity:.7; font-size:.75rem; margin-top:10px; }
  .name { margin-top:18px; font-size:2rem; font-weight:bold; min-height:2.6rem; text-align:center; padding:0 10px; }
  .hint { color:#fff; margin-top:16px; opacity:.85; text-align:center; }
  .pop { animation:pop .3s ease; }
  @keyframes pop { from { transform:scale(.85); opacity:0; } to { transform:scale(1); opacity:1; } }
</style>
</head>
<body>
<h1>🦁 Guess the Animal 🐸</h1>

<div id="menu" class="cats"></div>

<div id="game">
  <div class="bar"><button id="back">← Decks</button><span id="count"></span></div>
  <div class="card" id="card">
    <div class="tag" id="tag"></div>
    <img class="pic" id="pic">
    <div class="name" id="name"></div>
  </div>
  <div class="hint" id="hint">Tap the card to reveal the name</div>
  <div class="credit">Photos from Wikipedia</div>
</div>

  "Fish": ["Great White Shark|Great white shark","Hammerhead Shark|Great hammerhead","Whale Shark|Whale shark","Tiger Shark|Tiger shark","Bull Shark|Bull shark","Basking Shark|Basking shark","Mako Shark|Shortfin mako shark","Manta Ray|Giant oceanic manta ray","Stingray|Southern stingray","Clownfish|Ocellaris clownfish","Blue Tang|Paracanthurus","Yellow Tang|Yellow tang","Mandarinfish","Lionfish|Red lionfish","Pufferfish|Tetraodontidae","Porcupinefish","Moorish Idol|Moorish idol","Parrotfish","Angelfish|Pomacanthus imperator","Butterflyfish|Copperband butterflyfish","Seahorse","Leafy Seadragon|Leafy seadragon","Moray Eel|Green moray","Ocean Sunfish|Ocean sunfish","Swordfish","Sailfish|Atlantic sailfish","Bluefin Tuna|Atlantic bluefin tuna","Barracuda|Great barracuda","Atlantic Salmon|Atlantic salmon","Rainbow Trout|Rainbow trout","Atlantic Cod|Atlantic cod","Atlantic Herring|Atlantic herring","Mackerel|Atlantic mackerel","Flounder|European flounder","Halibut|Atlantic halibut","Anglerfish","Koi","Common Carp|Common carp","Catfish|Wels catfish","Pike|Northern pike","Perch|European perch","Piranha|Red-bellied piranha","Arowana|Silver arowana","Arapaima","Electric Eel|Electric eel","Sturgeon|Beluga (sturgeon)","Coelacanth|West Indian Ocean coelacanth","Flying Fish|Flying fish","Archerfish","Mudskipper","Discus|Symphysodon","Neon Tetra|Neon tetra","Oscar|Oscar (fish)","Zebrafish","Goby|Round goby","Wrasse|Humphead wrasse","Grouper|Atlantic goliath grouper","Hagfish","Sea Lamprey|Sea lamprey","Oarfish|Giant oarfish"],

const ICONS = {Jungle:"🌴",Pets:"🐶",Bugs:"🐞",African:"🦁",Birds:"🦜",Exotic:"🦘",Reptiles:"🦎",Amphibians:"🐸",Fish:"🐠",Dinosaurs:"🦖"};

const $ = id => document.getElementById(id);
let deck = [], i = 0, revealed = false;
const images = {}; // wiki title -> image url, or null if none

const menu = $("menu");
for (const n of [...Object.keys(DECKS), "Mixed"]) {
  const b = document.createElement("button");
  b.className = "cat";
  const size = n === "Mixed" ? Object.values(DECKS).reduce((s, l) => s + l.length, 0) : DECKS[n].length;
  b.innerHTML = `<span>${ICONS[n] || "🎲"}</span>${n === "Mixed" ? "Mix of Everything" : n}<small>${size} cards</small>`;
  b.onclick = () => start(n);
  menu.appendChild(b);
}

function cards(list, cat) { return list.map(s => { const [name, title] = s.split("|"); return {name, title: title || name, cat}; }); }
function shuffle(a) { for (let k = a.length - 1; k > 0; k--) { const j = Math.floor(Math.random() * (k + 1)); [a[k], a[j]] = [a[j], a[k]]; } return a; }

// Look up photos on Wikipedia, up to 50 animals per request
async function loadImages(from) {
  const todo = [];
  for (let k = from; k < deck.length && todo.length < 50; k++)
    if (!(deck[k].title in images) && !todo.includes(deck[k].title)) todo.push(deck[k].title);
  if (!todo.length) return;
  const url = "https://en.wikipedia.org/w/api.php?action=query&format=json&origin=*&redirects=1&prop=pageimages&piprop=thumbnail&pithumbsize=640&titles=" + encodeURIComponent(todo.join("|"));
  try {
    const data = await (await fetch(url)).json();
    const q = data.query || {}, alias = {};
    for (const r of [...(q.normalized || []), ...(q.redirects || [])]) alias[r.to] = r.from;
    const orig = t => { while (alias[t]) t = alias[t]; return t; };
    for (const pg of Object.values(q.pages || {})) images[orig(pg.title)] = pg.thumbnail ? pg.thumbnail.source : null;
  } catch (e) { return; }
  for (const t of todo) if (!(t in images)) images[t] = null;
}

async function start(n) {
  deck = shuffle(n === "Mixed" ? Object.entries(DECKS).flatMap(([c, l]) => cards(l, c)) : cards(DECKS[n], n));
  i = 0;
  menu.style.display = "none"; $("game").style.display = "flex";
  await show();
}

async function show() {
  revealed = false;
  $("name").textContent = ""; $("pic").removeAttribute("src"); $("hint").textContent = "Loading…";
  for (let tries = 0; tries < deck.length; tries++) {
    if (!(deck[i].title in images)) await loadImages(i);
    if (images[deck[i].title]) break;
    if (!(deck[i].title in images)) { $("hint").textContent = "Couldn't load pictures – check your internet connection and tap to retry"; return; }
    deck.splice(i, 1); // no photo for this one, skip it
    if (i >= deck.length) i = 0;
  }
  const c = deck[i];
  $("pic").src = images[c.title]; $("pic").alt = "Mystery animal";
  $("tag").textContent = c.cat;
  $("count").textContent = `Card ${i + 1} of ${deck.length}`;
  $("hint").textContent = "Tap the card to reveal the name";
  const card = $("card"); card.classList.remove("pop"); void card.offsetWidth; card.classList.add("pop");
  const next = deck[i + 1]; if (next && images[next.title]) new Image().src = images[next.title];
  if (deck[i + 10] && !(deck[i + 10].title in images)) loadImages(i + 10);
}

$("card").onclick = () => {
  if (!$("pic").getAttribute("src")) { show(); return; }
  if (!revealed) {
    revealed = true; $("name").textContent = deck[i].name;
    $("hint").textContent = i + 1 < deck.length ? "Tap again for the next animal" : "Last card! Tap to shuffle and play again";
  } else {
    i++; if (i >= deck.length) { shuffle(deck); i = 0; }
    show();
  }
};
$("back").onclick = () => { $("game").style.display = "none"; menu.style.display = "grid"; };
</script>
</body>
</html>
